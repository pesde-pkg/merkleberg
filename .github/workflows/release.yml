name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read crate version
        id: crate
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          version="$(jq -r '.packages[] | select(.name == "merkleberg") | .version' <<< "$metadata")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify metadata
        id: version
        uses: actions/github-script@v9
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        with:
          script: |
            const fs = require('fs');

            const tagVersion = context.ref.replace(/^refs\/tags\/v/, '');
            const crateVersion = process.env.CRATE_VERSION;

            if (tagVersion !== crateVersion) {
              core.setFailed(`tag v${tagVersion} doesn't match crate ${crateVersion}`);
              return;
            }

            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const escaped = crateVersion.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (!new RegExp(`^## \\[${escaped}\\]`, 'm').test(changelog)) {
              core.setFailed(`changelog doesn't have an entry for v${tagVersion}`);
              return;
            }

            core.setOutput('version', crateVersion);
            core.setOutput('prerelease', String(crateVersion.includes('-')));

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: crates-io
      url: https://crates.io/crates/merkleberg/${{ needs.verify.outputs.version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tooling
        uses: jdx/mise-action@v5
        with:
          version: 2026.5.6
          install: true
          cache: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Package crate
        run: cargo package --locked
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""

      - name: Publish
        run: cargo publish --locked --no-verify
        env:
          CARGO_TERM_COLOR: always
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/package/merkleberg-${{ needs.verify.outputs.version }}.crate

      - name: Upload crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: crate
          path: target/package/merkleberg-${{ needs.verify.outputs.version }}.crate
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download crate artifact
        uses: actions/download-artifact@v8
        with:
          name: crate

      - name: Create release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        with:
          script: |
            const fs = require('fs');

            const { VERSION, PRERELEASE } = process.env;
            const tag = `v${VERSION}`;

            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const escaped = VERSION.replaceAll('.', '\\.');
            const [_, notes] = changelog.match(new RegExp(
              `^## \\[${escaped}\\].*$([\\s\\S]*?)(?=^## \\[|^\\[.+\\]: |(?![\\s\\S]))`,
              'm',
            ));

            const footer = `**Get it at [crates.io](https://crates.io/crates/merkleberg/${VERSION})**.`;

            // Create a draft release which we can attach assets to
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: tag,
              body: [notes.trim(), footer].join('\n\n'),
              prerelease: PRERELEASE === 'true',
              draft: true,
            });

            // Attach the crate artifact
            const crate = `merkleberg-${VERSION}.crate`;
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id: release.id,
              name: crate,
              data: fs.readFileSync(crate),
              headers: { 'content-type': 'application/gzip' },
            });

            // Publish the release
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              draft: false,
            });
