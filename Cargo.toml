[package]
name = "merkleberg"
version = "0.1.0"
authors = ["Erica Marigold <hi@devcomp.xyz> ", "Nervos Core Dev <dev@nervos.org>"]
documentation = "https://docs.rs/merkleberg"
edition = "2024"
homepage = "https://pesde.dev/"
rust-version = "1.85.0"
license = "MIT"
description = "Merkle mountain range library in Rust"
repository = "https://github.com/pesde-pkg/merkleberg"

[features]
default = ["std", "digest"]
std = ["thiserror/std"]
digest = ["dep:digest"]
unsafe-digest = ["digest"]
serde = ["dep:serde"]

[dependencies]
cfg-if = "1.0"
futures-util = "0.3"
digest = { version = "0.11", optional = true }
thiserror = { version = "2.0", default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
faster-hex = "0.8.0"
criterion = "0.5.1"
rand = "0.8.5"
proptest = "1.2.0"
lazy_static = "1.4.0"
bytes = "1.4.0"
blake2b-rs = "0.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.11"

[[bench]]
name = "mmr_benchmark"
harness = false

[[bench]]
name = "helper_benchmark"
harness = false

[[bench]]
name = "mmriver_benchmark"
harness = false
